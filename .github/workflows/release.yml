name: Release

# A release starts only from an annotated tag vMAJOR.MINOR.PATCH on a commit that
# is already on main, created by a human after approval (RELEASE.md). This
# workflow verifies that commit, builds and smoke-tests the artifacts without
# any write permission, then attests them and creates the GitHub Release in a
# separate job that runs no third-party Python. It never publishes to PyPI and
# never deploys anything.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a release half-way

jobs:
  verify:
    name: Verify the tagged commit (full CI)
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and smoke-test the artifacts (read-only)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # This job installs and runs third-party code (build backend, CI tools, the
    # wheel's dependencies), so it holds no write or OIDC permission.
    permissions:
      contents: read
    # Digests taken right after the build, before the smoke test installs and
    # runs the wheel's dependencies. A later step cannot change a step output,
    # so publish checks the artifacts against these, not against a file that
    # travelled with them.
    outputs:
      sha256sums: ${{ steps.hash.outputs.sha256sums }}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # Full history and all tags (annotations preserved since checkout v6.0.2):
      # needed for the annotated-tag and main-ancestry checks and the compare link.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Tag must be annotated, on main, and match the version and changelog
        run: |
          if [ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag; release tags must be annotated (git tag -a)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main"
            exit 1
          fi
          mkdir -p release-meta
          python tools/check_release.py --tag "$TAG" --notes release-meta/changelog-notes.md

      - name: Install CI tools
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Build sdist and wheel
        run: python -m build
      - name: Checksums
        id: hash
        run: |
          cd dist
          sha256sum soma_mcp-* > SHA256SUMS
          cat SHA256SUMS
          {
            echo "sha256sums<<SHA256SUMS_EOF"
            cat SHA256SUMS
            echo "SHA256SUMS_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
      - name: twine check
        run: python -m twine check --strict dist/*
      - name: Install the wheel in a clean environment and smoke-test it
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/python" -m pip install --no-cache-dir dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/python" -I "$GITHUB_WORKSPACE/tools/smoke_test.py" \
            --expect-version "${TAG#v}"
          "$RUNNER_TEMP/wheel/bin/soma-mcp" --version > "$GITHUB_WORKSPACE/release-meta/stack.txt"

      - name: Release notes
        env:
          SHA256SUMS: ${{ steps.hash.outputs.sha256sums }}
        run: |
          VERSION="${TAG#v}"
          PREVIOUS="$(git tag --list 'v*.*.*' --sort=-v:refname | grep -vx "$TAG" | head -n1 || true)"
          {
            cat release-meta/changelog-notes.md
            echo
            echo "## Verify this release"
            echo
            echo "Built and smoke-tested by this workflow from the annotated tag \`$TAG\`:"
            echo
            echo '```text'
            cat release-meta/stack.txt
            printf '%s\n' "$SHA256SUMS" | sed '/^$/d'
            echo '```'
            echo
            echo '```bash'
            echo "sha256sum --check SHA256SUMS"
            echo "gh attestation verify soma_mcp-${VERSION}-py3-none-any.whl --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo "Upgrade notes: [docs/upgrading.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/upgrading.md)."
            if [ -n "$PREVIOUS" ]; then
              echo "Changes: https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS...$TAG"
            else
              echo "Commits: https://github.com/$GITHUB_REPOSITORY/commits/$TAG"
            fi
          } > release-meta/release-notes.md
          cat release-meta/release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-meta/release-notes.md
          if-no-files-found: error

  publish:
    name: Attest and create the GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Required reviewers on this environment are the human gate between "tag
    # pushed" and "release published" (RELEASE.md, Repository settings).
    environment: release
    # The only job with write access. It runs no pip install and no project
    # code: it checks the digests, attests and calls the GitHub CLI.
    permissions:
      contents: write # create the GitHub Release and upload its assets
      id-token: write # Sigstore certificate for the build provenance attestation
      attestations: write # store the attestation on the repository
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-meta
      - name: Verify the artifacts against the digests taken right after the build
        env:
          EXPECTED: ${{ needs.build.outputs.sha256sums }}
        run: |
          # Blank lines dropped: a multiline step output may or may not keep
          # its final newline, and sha256sum --strict rejects empty lines.
          printf '%s\n' "$EXPECTED" | sed '/^$/d' > "$RUNNER_TEMP/expected.sums"
          cmp "$RUNNER_TEMP/expected.sums" dist/SHA256SUMS
          cd dist
          sha256sum --check --strict "$RUNNER_TEMP/expected.sums"
          # Exactly the built files plus SHA256SUMS, nothing added on the way.
          diff <(ls soma_mcp-* | sort) <(awk '{print $2}' "$RUNNER_TEMP/expected.sums" | sort)
          ls -l

      - name: Attest build provenance (wheel and sdist)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/soma_mcp-*

      # Assets go onto a draft first and the release is published last, so a
      # failure leaves an editable draft that a re-run completes. A published
      # release is final (immutable releases): a re-run then stops, and the fix
      # is a new patch version.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="SOMA MCP ${TAG#v}"
          STATE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)"
          case "$STATE" in
            missing)
              gh release create "$TAG" dist/* --draft --verify-tag --title "$TITLE" \
                --notes-file release-meta/release-notes.md --repo "$GITHUB_REPOSITORY"
              ;;
            true)
              gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
              gh release edit "$TAG" --title "$TITLE" \
                --notes-file release-meta/release-notes.md --repo "$GITHUB_REPOSITORY"
              ;;
            *)
              echo "::error::$TAG is already published; published releases are final. Release a new patch version instead."
              exit 1
              ;;
          esac
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
