approval_policy = "on-request"
default_permissions = "soma_workspace"
allow_login_shell = false

[features]
hooks = true

[agents]
max_threads = 4
max_depth = 1
interrupt_message = true

[permissions.soma_workspace]
description = "Workspace access with project secrets and private keys denied."
extends = ":workspace"

[permissions.soma_workspace.filesystem]
glob_scan_max_depth = 6

[permissions.soma_workspace.filesystem.":workspace_roots"]
".env" = "deny"
".env.*" = "deny"
"**/.env" = "deny"
"**/.env.*" = "deny"
"*.pem" = "deny"
"**/*.pem" = "deny"
"*.key" = "deny"
"**/*.key" = "deny"
"*credentials*.json" = "deny"
"**/*credentials*.json" = "deny"
"*service-account*.json" = "deny"
"**/*service-account*.json" = "deny"

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false
exclude = ["*_KEY", "*_SECRET", "*_TOKEN", "*_PASSWORD", "*_CREDENTIAL*"]

# A personal SOMA MCP deployment goes in your user-level ~/.codex/config.toml
# ([mcp_servers.soma] with its url and per-tool approvals), never here: this
# repository is public (AGENTS.md, "Repository privacy").

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"
auth = "oauth"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 120
default_tools_approval_mode = "writes"

[mcp_servers.linear.tools.delete_attachment]
approval_mode = "prompt"

[mcp_servers.linear.tools.delete_comment]
approval_mode = "prompt"

[mcp_servers.linear.tools.delete_status_update]
approval_mode = "prompt"
